[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palworld-discord-bot"
version = "0.1.0"
description = "Palworld Discord status bot and local host-PC admin tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "discord.py>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "tzdata>=2024.1",
    "pywebview>=5.0",
    "palworld-save-tools>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]
package = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
palworld-discord-bot = "palworld_discord_bot.__main__:main"
palworld-admin = "palworld_admin.__main__:main"
palworld-setup = "palworld_discord_bot.setup:main"

[tool.setuptools.packages.find]
include = ["palworld_discord_bot*", "palworld_admin*"]

[tool.setuptools.package-data]
palworld_admin = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
